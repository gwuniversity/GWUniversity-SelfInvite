name: 'Close stale issues'
on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@3a9db7e6a41a89f618792c92c0e97cc736e1b13f  #v10
        with:
          stale-issue-message: 'This issue is stale because it has been open 14 days with no activity. Remove stale label or comment or this will be closed in 5 days.'
          days-before-stale: 14
          days-before-close: 5
      
      - name: Checkout 
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 #v6

      - name: Commit and push if last commit > 45 days
        run: |
          LAST_COMMIT_EPOCH=$(git log -1 --format=%ct)
          CURRENT_EPOCH=$(date +%s)
          DAYS_OLD=$(( (CURRENT_EPOCH - LAST_COMMIT_EPOCH) / 86400 ))

          if [ $DAYS_OLD -gt 45 ]; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            
            # Make your file changes here
            
            git add .
            git commit --allow-empty -m "Automated commit: $(date +'%m%d%y')"
            git push
          fi

